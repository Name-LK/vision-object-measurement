sensor:
  type: "kinect_v1"
  step_downsample: 4
  z_min_cutoff: 500
  z_max_cutoff: 4000

roi_bounds:
  min_x: -250
  max_x: 250
  min_y: -200
  max_y: 200
  min_z: 850
  max_z: 2000

processing:
  plane_distance_threshold: 3.0
  outlier_nb_neighbors: 20
  outlier_std_ratio: 2.0

color_detection:
  lower_hsv: [100, 150, 50]
  upper_hsv: [130, 255, 255]
  min_area: 500